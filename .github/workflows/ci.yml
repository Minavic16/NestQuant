name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nqts:
    name: NQTS (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e "./nqts[dev]"
      - name: Full NQTS suite (includes architecture-boundary + breaker-fixture parity guards)
        run: pytest nqts/tests -q
        env:
          NESTQUANT_SKIP_LIVE_CHECK: "1"
          NESTQUANT_SKIP_DASHBOARD_CHECK: "1"

  studio:
    name: Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      # Studio depends on NQTS (indicators/contracts); NQTS never depends on Studio.
      - run: pip install -e ./nqts -e "./studio[dev]"
      - run: ruff check studio
      - run: pytest studio/tests -q
        env:
          STUDIO_DB_PATH: ":memory:"
          NESTQUANT_SKIP_LIVE_CHECK: "1"
          NESTQUANT_SKIP_DASHBOARD_CHECK: "1"

  rust:
    name: NQTS (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            nqts/rust/target
          key: cargo-${{ hashFiles('nqts/rust/Cargo.lock') }}
      - run: cargo fmt --all -- --check
        working-directory: nqts/rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: nqts/rust
      - run: cargo test --all
        working-directory: nqts/rust
