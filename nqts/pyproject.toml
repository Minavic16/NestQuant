[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nestquant"
version = "0.3.0"
description = "NestQuant — Autonomous Quantitative Research Platform"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "requests>=2.31",
]

[project.optional-dependencies]
# MetaTrader5 only ships Windows wheels; on Linux the MT5 bridge is reached over HTTP.
mt5 = ["MetaTrader5>=5.0; sys_platform == 'win32'"]
dotenv = ["python-dotenv>=1.0"]
data = ["dukascopy-python>=4.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nestquant", "nestquant.*"]
